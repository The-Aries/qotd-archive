name: Validate QOTD

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests and data integrity
        run: |
          python3 -m unittest discover -s tests -v
          python3 scripts/build_archive.py --output /tmp/qotd-validated.json
          node --check app.js
          node --check add.js
